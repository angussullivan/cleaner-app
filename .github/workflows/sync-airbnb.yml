name: Sync Airbnb Calendar

on:
  # Triggered externally by cron-job.org every hour. GitHub's own scheduler
  # delays or skips runs on quiet repos, which made the 24h check-in alerts late.
  # See docs/OWNER-SETUP.md for the cron-job.org job.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      - name: Install dependencies
        run: cd .github/scripts && npm install

      - name: Sync Airbnb calendar
        run: cd .github/scripts && node sync-airbnb.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER:           ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          AIRBNB_ICAL_ROOM_1:   ${{ secrets.AIRBNB_ICAL_ROOM_1 }}
          AIRBNB_ICAL_ROOM_2:   ${{ secrets.AIRBNB_ICAL_ROOM_2 }}
          AIRBNB_ICAL_ROOM_3:   ${{ secrets.AIRBNB_ICAL_ROOM_3 }}
          NOTIFY_CLEANER_EMAIL: ${{ secrets.NOTIFY_CLEANER_EMAIL }}
          NOTIFY_OWNER_EMAILS:  ${{ secrets.NOTIFY_OWNER_EMAILS }}
